<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>きょうの太陽</title>
<meta name="description" content="日本各地の日の出・日の入り時刻。昼の長さ、南中時刻も。">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-NCPP5SQPXH"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

<style>
  :root {
    --sky1: #8ec3ea;
    --sky2: #ffe9c2;
    --text: #3a3226;
    --dim: #8a7d68;
    --accent: #e07b2f;
    --card: rgba(255, 255, 255, 0.65);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: linear-gradient(180deg, var(--sky1), var(--sky2) 75%);
    color: var(--text);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "BIZ UDMincho", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 3rem;
  }
  h1 { font-size: 1.6rem; font-weight: 500; letter-spacing: 0.5em; text-indent: 0.5em; margin-bottom: 0.4rem; }
  #date-label { color: var(--dim); font-size: 0.9rem; letter-spacing: 0.15em; margin-bottom: 1.2rem; }
  #controls { display: flex; gap: 0.8rem; align-items: center; flex-wrap: wrap; justify-content: center; margin-bottom: 1.2rem; }
  select, input[type="date"] {
    background: var(--card);
    border: 1px solid rgba(58, 50, 38, 0.25);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    padding: 0.4rem 0.7rem;
  }
  #arc-wrap { margin-bottom: 0.8rem; }
  #facts { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; margin-bottom: 1.2rem; }
  .fact {
    background: var(--card);
    border: 1px solid rgba(58, 50, 38, 0.12);
    border-radius: 10px;
    padding: 0.8rem 1.3rem;
    text-align: center;
    min-width: 8.5rem;
  }
  .fact .label { color: var(--dim); font-size: 0.75rem; letter-spacing: 0.2em; margin-bottom: 0.3rem; }
  .fact .value { font-size: 1.3rem; }
  .fact .sub { color: var(--dim); font-size: 0.75rem; margin-top: 0.2rem; }
  footer { margin-top: 2rem; color: var(--dim); font-size: 0.72rem; letter-spacing: 0.1em; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<h1>きょうの太陽</h1>
<div id="date-label"></div>
<div id="controls">
  <select id="city"></select>
  <input type="date" id="picker">
</div>
<div id="arc-wrap"></div>
<div id="facts">
  <div class="fact"><div class="label">日の出</div><div class="value" id="sunrise"></div></div>
  <div class="fact"><div class="label">南中</div><div class="value" id="noon"></div></div>
  <div class="fact"><div class="label">日の入り</div><div class="value" id="sunset"></div></div>
  <div class="fact"><div class="label">昼の長さ</div><div class="value" id="daylen"></div><div class="sub" id="daydiff"></div></div>
</div>
<footer>
  NOAAの太陽位置計算式による概算です（誤差±1〜2分程度）。時刻はすべて日本標準時。
</footer>

<script>
"use strict";
const CITIES = [
  { name: "札幌", lat: 43.06, lng: 141.35 },
  { name: "仙台", lat: 38.27, lng: 140.87 },
  { name: "新潟", lat: 37.90, lng: 139.02 },
  { name: "東京", lat: 35.68, lng: 139.69 },
  { name: "名古屋", lat: 35.18, lng: 136.91 },
  { name: "大阪", lat: 34.69, lng: 135.50 },
  { name: "広島", lat: 34.39, lng: 132.46 },
  { name: "福岡", lat: 33.59, lng: 130.40 },
  { name: "鹿児島", lat: 31.60, lng: 130.56 },
  { name: "那覇", lat: 26.21, lng: 127.68 },
];
const JST_OFFSET_MIN = 540;
const rad = d => d * Math.PI / 180;
// 閲覧者のタイムゾーンに依存せずJSTの「今」を得る（UTC+9にずらしてUTCアクセサで読む）
const jstNow = () => new Date(Date.now() + JST_OFFSET_MIN * 60000);
const jstTodayStr = () => {
  const d = jstNow();
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
};

// NOAAの式で日の出・南中・日の入りをJSTの分で返す
function solarTimes(date, lat, lng) {
  const startOfYear = Date.UTC(date.getFullYear(), 0, 1);
  const dayOfYear = Math.floor((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - startOfYear) / 86400000) + 1;
  const g = 2 * Math.PI / 365 * (dayOfYear - 1 + 0.5);
  const eqtime = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g)
    - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g)
    - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g)
    - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const cosHa = Math.cos(rad(90.833)) / (Math.cos(rad(lat)) * Math.cos(decl)) - Math.tan(rad(lat)) * Math.tan(decl);
  const haDeg = Math.acos(Math.min(1, Math.max(-1, cosHa))) * 180 / Math.PI;
  return {
    sunrise: 720 - 4 * (lng + haDeg) - eqtime + JST_OFFSET_MIN,
    noon: 720 - 4 * lng - eqtime + JST_OFFSET_MIN,
    sunset: 720 - 4 * (lng - haDeg) - eqtime + JST_OFFSET_MIN,
  };
}

const hhmm = min => {
  const m = Math.round(min);
  return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`;
};

function arcSVG(times, showNow) {
  const W = 480, H = 230, R = 180, cx = W / 2, cy = H - 20;
  let sun = "";
  if (showNow) {
    const now = jstNow();
    const nowMin = now.getUTCHours() * 60 + now.getUTCMinutes();
    const f = (nowMin - times.sunrise) / (times.sunset - times.sunrise);
    const up = f >= 0 && f <= 1;
    const theta = Math.PI * (1 - Math.min(1, Math.max(0, f)));
    const x = cx + R * Math.cos(theta);
    const y = cy - R * Math.sin(theta);
    sun = `<circle cx="${x}" cy="${y}" r="14" fill="${up ? "#ffb347" : "#c9baa4"}" stroke="#fff" stroke-width="2">
      ${up ? '<animate attributeName="r" values="14;16;14" dur="3s" repeatCount="indefinite"/>' : ""}
    </circle>`;
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="max-width:100%">
    <path d="M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${cx + R} ${cy}" fill="none"
      stroke="rgba(224,123,47,0.5)" stroke-width="2" stroke-dasharray="6 7"/>
    <line x1="20" y1="${cy}" x2="${W - 20}" y2="${cy}" stroke="rgba(58,50,38,0.35)" stroke-width="1.5"/>
    <text x="${cx - R}" y="${cy + 22}" text-anchor="middle" font-size="13" fill="#8a7d68">日の出</text>
    <text x="${cx + R}" y="${cy + 22}" text-anchor="middle" font-size="13" fill="#8a7d68">日の入り</text>
    ${sun}
  </svg>`;
}

const fmtFull = new Intl.DateTimeFormat("ja-JP", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
const citySel = document.getElementById("city");
const picker = document.getElementById("picker");

CITIES.forEach((c, i) => citySel.add(new Option(c.name, i)));
citySel.value = localStorage.getItem("city") || "3"; // 既定は東京
picker.value = jstTodayStr();

function render() {
  const city = CITIES[Number(citySel.value)];
  const date = new Date(picker.value + "T12:00:00");
  const t = solarTimes(date, city.lat, city.lng);
  const yesterday = solarTimes(new Date(date.getTime() - 86400000), city.lat, city.lng);
  const dayLen = t.sunset - t.sunrise;
  const diff = dayLen - (yesterday.sunset - yesterday.sunrise);

  const isToday = picker.value === jstTodayStr();
  document.getElementById("date-label").textContent = `${fmtFull.format(date)}・${city.name}`;
  document.getElementById("arc-wrap").innerHTML = arcSVG(t, isToday);
  document.getElementById("sunrise").textContent = hhmm(t.sunrise);
  document.getElementById("noon").textContent = hhmm(t.noon);
  document.getElementById("sunset").textContent = hhmm(t.sunset);
  const dayLenMin = Math.round(dayLen);
  document.getElementById("daylen").textContent = `${Math.floor(dayLenMin / 60)}時間${String(dayLenMin % 60).padStart(2, "0")}分`;
  document.getElementById("daydiff").textContent =
    `前日比 ${diff >= 0 ? "+" : "−"}${Math.abs(diff).toFixed(1)}分`;
}

citySel.addEventListener("change", () => { localStorage.setItem("city", citySel.value); render(); });
picker.addEventListener("change", () => { if (picker.value) render(); });
render();
</script>
</body>
</html>
